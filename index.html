<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义导航页</title>
  <style type="text/css">
    body {
      background: #000;
      color: #999;
    }

    h4 {
      height: 25px;
      padding: 0px;
      margin: 0px;
      font-size: 14px;
    }

    a {
      color: #999;
    }

    .card {
      width: 120px;
      float: left;
      border: 1px dotted #999;
      text-align: center;
      padding: 16px 12px 16px 12px;
      position: relative;
      height: 38px;
    }
    .child {
      display: none;
      position: absolute;
      left: 0px;
      bottom: 0px;
      padding:3px;
    }

    .card:hover .child {
      display: block;
    }

    .edit-btn,
    .delete-btn {
      font-size: 11px;
      cursor: pointer;
    }

    .search-engine-btn {
      padding: 5px 12px 5px 11px;
      font-size: 12px;
      height: 34px;
    }

    .active {
      color: blue;
      font-weight: bold;
    }

    input,
    button {
      background-color: #999;
    }
  </style>
</head>

<body>
  <div>
    <!-- 头部区域 -->
    <header style="padding:8px 0px 0px 2px;">

      <!-- 搜索区域 -->
      <div class="relative">
        <!-- 搜索引擎切换 -->
        <div class="flex" style="margin:0px 0px 8px 0px ;">
          <button id="bing" class="search-engine-btn active">Bing</button>
          <button id="baidu" class="search-engine-btn">百度</button>
          <button id="google" class="search-engine-btn">Google</button>
        </div>

        <!-- 搜索框 -->
        <form id="search-form" action="https://www.bing.com/search" method="get" class="relative">
          <input type="text" autofocus id="search-input" name="q" placeholder="输入搜索内容..." class="w-full"
            style="height: 22px;">
          <button type="submit" class="absolute" style="padding:4px 8px 6px 8px;">确定</button>
        </form>
      </div>
    </header>

    <!-- 链接分类区域 -->
    <main>
      <!-- 链接管理工具栏 -->
      <div class="flex">
        <h4 style="margin:10px auto;">常用链接 <span>(可拖动排序)</span></h4>
      </div>

      <!-- 链接卡片容器 -->
      <div id="links-container" class="grid grid-cols-2">
        <!-- 链接卡片将通过JS动态生成 -->
      </div>
    </main>

    <!-- 页脚 -->
    <footer class="mt-16" style="clear:both;"></footer>
  </div>

  <!-- 添加/编辑链接模态框 -->
  <div id="link-modal" class="fixed" style="margin-top:30px;border-top: 1px solid #999;padding-top: 20px;">
    <div class="bg-white" id="modal-content">
      <h4 class="text-xl" id="modal-title" onclick="toggle('#link-form')">添加新链接</h4>
      <form id="link-form" style="display: none;">
        <input type="hidden" id="link-id">
        <div class="mb-4">
          <label for="link-name">名称：</label>
          <input type="text" id="link-name">
        </div>

        <div class="mb-4" style="margin: 8px 0px 8px 0px;">
          <label for="link-url">网址：</label>
          <input type="url" id="link-url">
        </div>
        <div class="flex" style="padding-left:53px;">
          <button type="submit" class="flex-1" style="padding: 3px 8px 3px 8px;">保存</button>
        </div>
      </form>

    </div>
  </div>

  <script>
    // DOM元素
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const searchEngineBtns = document.querySelectorAll('.search-engine-btn');
    const addLinkBtn = document.getElementById('add-link');
    const linkModal = document.getElementById('link-modal');
    const modalContent = document.getElementById('modal-content');
    const cancelModal = document.getElementById('cancel-modal');
    const linkForm = document.getElementById('link-form');
    const linksContainer = document.getElementById('links-container');

    // 当前搜索引擎
    let currentEngine = 'bing';
    const engines = {
      baidu: {
        url: 'https://www.baidu.com/s',
        param: 'wd'
      },
      bing: {
        url: 'https://www.bing.com/search',
        param: 'q'
      },
      google: {
        url: 'https://www.google.com/search',
        param: 'q'
      }
    };

    // 当前拖动的元素ID
    let draggedItemId = null;

    // 初始化
    function init() {
      // 加载保存的链接
      loadLinks();

      // 搜索框焦点效果
      searchInput.addEventListener('focus', () => {
        searchInput.classList.add('search-focus');
      });

      searchInput.addEventListener('blur', () => {
        searchInput.classList.remove('search-focus');
      });

      // 搜索引擎切换
      searchEngineBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const engine = btn.id;
          if (engine !== currentEngine) {
            currentEngine = engine;
            updateSearchEngine();
          }
        });
      });

      // 表单提交
      linkForm.addEventListener('submit', handleLinkFormSubmit);

      // 初始化拖放事件委托
      initDragAndDrop();
    }

    // 初始化拖放功能
    function initDragAndDrop() {
      // 拖放事件委托
      linksContainer.addEventListener('dragstart', handleDragStart);
      linksContainer.addEventListener('dragover', handleDragOver);
      linksContainer.addEventListener('dragenter', handleDragEnter);
      linksContainer.addEventListener('dragleave', handleDragLeave);
      linksContainer.addEventListener('drop', handleDrop);
      linksContainer.addEventListener('dragend', handleDragEnd);
    }

    // 处理拖动开始
    function handleDragStart(e) {
      if (e.target.closest('.card')) {
        const card = e.target.closest('.card');
        draggedItemId = card.dataset.id;

        // 设置拖动效果
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedItemId);

        // 添加拖动样式
        setTimeout(() => {
          card.classList.add('drag-ghost');
        }, 0);
      }
    }

    // 处理拖动经过
    function handleDragOver(e) {
      if (e.target.closest('.card') && draggedItemId) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      }
    }

    // 处理拖动进入
    function handleDragEnter(e) {
      const card = e.target.closest('.card');
      if (card && card.dataset.id !== draggedItemId) {
        card.classList.add('drag-over');
      }
    }

    // 处理拖动离开
    function handleDragLeave(e) {
      const card = e.target.closest('.card');
      if (card) {
        card.classList.remove('drag-over');
      }
    }

    // 处理放置
    function handleDrop(e) {
      e.preventDefault();

      const dropTarget = e.target.closest('.card');
      if (dropTarget && dropTarget.dataset.id && dropTarget.dataset.id !== draggedItemId) {
        // 重新排序链接
        reorderLinks(draggedItemId, dropTarget.dataset.id);

        // 清除所有拖放样式
        document.querySelectorAll('.card').forEach(card => {
          card.classList.remove('drag-over', 'drag-ghost');
        });
      }
    }

    // 处理拖动结束
    function handleDragEnd() {
      // 清除所有拖放样式
      document.querySelectorAll('.card').forEach(card => {
        card.classList.remove('drag-over', 'drag-ghost');
      });
      draggedItemId = null;
    }

    // 重新排序链接
    function reorderLinks(draggedId, targetId) {
      const links = getLinks();
      const draggedIndex = links.findIndex(link => link.id === draggedId);
      const targetIndex = links.findIndex(link => link.id === targetId);

      if (draggedIndex !== -1 && targetIndex !== -1) {
        // 移除拖动项
        const [draggedItem] = links.splice(draggedIndex, 1);

        // 插入到目标位置
        if (draggedIndex < targetIndex) {
          links.splice(targetIndex, 0, draggedItem);
        } else {
          links.splice(targetIndex, 0, draggedItem);
        }

        // 保存并重新渲染
        saveLinks(links);
        renderLinks();
      }
    }

    // 更新搜索引擎 - 修复高亮样式问题
    function updateSearchEngine() {
      // 更新表单提交地址
      searchForm.action = engines[currentEngine].url;

      // 更新搜索参数名称
      searchInput.name = engines[currentEngine].param;

      // 更新按钮高亮样式
      searchEngineBtns.forEach(btn => {
        // 移除所有按钮的active类和默认样式
        btn.classList.remove('active', 'bg-primary');

        // 为当前选中的引擎添加active类
        if (btn.id === currentEngine) {
          btn.classList.add('active');
        } else {
          // 为未选中的引擎添加默认样式
          btn.classList.add('bg-slate-200');
        }
      });
    }

    // 打开编辑链接模态框
    function openEditModal(id) {
      const links = getLinks();
      const link = links.find(l => l.id === id);

      if (link) {
        document.getElementById('modal-title').textContent = '编辑链接';
        document.getElementById('link-id').value = link.id;
        document.getElementById('link-name').value = link.name;
        document.getElementById('link-url').value = link.url;
      }
    }

    // 处理链接表单提交
    function handleLinkFormSubmit(e) {
      e.preventDefault();

      const id = document.getElementById('link-id').value;
      const name = document.getElementById('link-name').value;
      const url = document.getElementById('link-url').value;

      if (!name || !url) {
        alert('请填写所有必填字段');
        return;
      }

      const links = getLinks();

      if (id) {
        // 更新现有链接
        const index = links.findIndex(l => l.id === id);
        if (index !== -1) {
          links[index] = { ...links[index], name, url };
        }
      } else {
        // 添加新链接
        links.push({
          id: Date.now().toString(),
          name,
          url: url.startsWith('http') ? url : `https://${url}`
        });
      }

      // 保存并刷新
      saveLinks(links);
      renderLinks();
      closeModal();
    }

      const links = localStorage.getItem('customLinks');
      return links ? JSON.parse(links) : [];
    }

    // 保存链接
    function saveLinks(links) {
      localStorage.setItem('customLinks', JSON.stringify(links));
    }

    // 渲染链接
    function renderLinks() {
      const links = getLinks();
      linksContainer.innerHTML = '';

      if (links.length === 0) {
        linksContainer.innerHTML = `
          <div class="col-span-full">
            <p class="text-slate-500">暂无链接，点击"添加"按钮创建第一个链接吧</p>
          </div>
        `;
        return;
      }

      links.forEach(link => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = link.id;
        card.draggable = true; // 使卡片可拖动

        card.innerHTML = `
          <div class="flex">
            <a href="${link.url}" class="absolute"><h4 class="font-medium">${link.name}</h4></a>
          </div>
          <div class="child">
              <span class="edit-btn" data-id="${link.id}">编辑</span>
              <span class="delete-btn" data-id="${link.id}">删除</span>
          </div>
        `;

        linksContainer.appendChild(card);
      });

      // 添加编辑和删除事件监听
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(btn.dataset.id);
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('确定要删除这个链接吗？')) {
            const links = getLinks().filter(link => link.id !== btn.dataset.id);
            saveLinks(links);
            renderLinks();
          }
        });
      });
    }

    // 加载链接
    function loadLinks() {
      renderLinks();
    }

    // 初始化页面
    document.addEventListener('DOMContentLoaded', init);
  </script>

  <script>
    function toggle(selector) {
      const el = document.querySelector(selector);
      if (el.style.display === 'none') {
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }
  </script>

</body>
